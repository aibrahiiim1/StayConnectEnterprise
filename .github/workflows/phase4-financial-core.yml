name: Phase 4 Financial Core CI

# The authoritative automated gate for the Phase-4 financial execution core. It runs on the exact HEAD under
# test and produces machine-verifiable evidence — never a hand-typed number and never a workstation result.
#
# What it proves, in order:
#   1. the financial core builds, vets and formats clean;
#   2. its unit matrix passes, including the PS golden wire, the PA catalog and the DARK guard;
#   3. it passes under the race detector, because the outbox lanes and the review path are concurrent;
#   4. migrations 0011 through 0026 apply, re-apply as designed, reverse cleanly, and weaken nothing that
#      existed before them — the gate re-runs the ENTIRE pre-0011 financial invariant suite on both chains;
#   5. the financial core behaves correctly against a real PostgreSQL: fail-closed creation, P# under
#      contention, independent interface lanes, UNKNOWN that never auto-retries, and reviewer races;
#   6. NOTHING in the tree enables a Phase-4 flag, and no financial record can leave a Phase-3 connector.
#
# It contacts no appliance, no Production database, no PMS and no payment provider. Every database it uses
# is a disposable container it creates and destroys itself, and every transport in the tests is an
# in-process stub.

# The phase branch is in the trigger list deliberately. workflow_dispatch cannot reach a workflow that does
# not yet exist on the default branch, and the Phase-4 delivery rule is one branch and ONE eventual PR -- so
# without this, the only way to obtain authoritative CI for the work in progress would be to open a PR early
# or to merge, and neither is authorized. A push trigger uses the workflow file from the pushed branch, so
# the branch gates itself on the exact HEAD under test.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, 'phase/**' ]
  # workflow_dispatch is DELIBERATELY ABSENT from this gate.
  #
  # A dispatched run reports a check with the SAME NAME as the pull_request run, because a required status
  # context IS the job name. That has two consequences, both of which cost this project real delivery time:
  # a dispatched run in progress blocks the merge of a PR whose own checks are already green, and a
  # dispatched SUCCESS is a candidate the evidence-reuse lookup can inherit -- so a required check could be
  # satisfied by a run that never evaluated a pull request. The gate must be earned on the event that
  # actually proposes the change. To re-run after a genuine correction, re-run the FAILED JOBS of the
  # pull_request run; do not dispatch a fresh one.

# ---------------------------------------------------------------------------------------------------------
# ONE RUN PER REF, AND A SUPERSEDED RUN IS CANCELLED INSTEAD OF BEING LEFT TO FINISH.
#
# Without this key -- and until now there was no `concurrency:` key in ANY of the four gate workflows -- every
# push to a PR branch started a run that nothing ever stopped. The runs for the abandoned commits kept a
# runner busy, kept writing evidence, and kept reporting a check whose name is REQUIRED, so an obsolete run
# could still be "in progress" for an old commit while the branch had already moved on.
#
# cancel-in-progress is deliberately TRUE ONLY FOR pull_request. A push to master must never be cancelled:
# master's green record is the thing the protection rule reads, and cancelling it would leave the default
# branch with a check that is neither passing nor failing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phase4-financial-core-gate:
    name: phase4-financial-core-gate
    runs-on: ubuntu-latest
    env:
      EVID: ${{ github.workspace }}/.phase4-evidence
    steps:
      - name: Check out the PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: data-plane/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # Not reuse-conditional, because the dependency gate later on is not: `npm audit` reads
      # package-lock.json and needs no installed tree, so Node must be here on a reuse hit too. It also has
      # to sit BEFORE the environment fingerprint, or the Node version this gate actually uses would not be
      # inside the key that decides whether an earlier verdict is about the same machine.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hotel-admin/package-lock.json

      # MEASURE THE MACHINE BEFORE DECIDING WHETHER TO TRUST AN EARLIER ONE. `ubuntu-latest`, `Go 1.25, Node 20, Python 3.12` and
      # version-tagged actions all resolve at run time, so an identical tree says nothing about the toolchain
      # that would run the tests. This publishes a fingerprint of the resolved environment; the lookup below
      # reads the candidate run's own fingerprint out of its log and refuses to reuse across a difference.
      - name: Execution-environment fingerprint
        id: env
        run: bash scripts/ci/env-fingerprint.sh postgres:16-alpine

      # HAS THIS EXACT CONTENT ALREADY BEEN PROVEN GREEN BY THIS GATE, IN AN EQUIVALENT CONTEXT?
      #
      # This exists because the merge commit's tree was byte-identical to the pull-request head's tree in
      # thirteen of the last thirteen merges: the second run was re-deriving a verdict it already held.
      #
      # A HIT REQUIRES FOUR THINGS, not just a matching tree. The same workflow; an IDENTICAL TREE (and this
      # file, the scripts it calls and the sources under test are all tracked, so a changed check is a
      # changed tree and a changed tree never matches); ANCESTRY, so evidence from an unrelated branch that
      # happens to render the same content can never be borrowed; and RECENCY, so an old verdict cannot be
      # resurrected for content that returns later. Every failure path reports no hit and the full gate runs.
      #
      # A HIT DOES NOT SKIP EVERYTHING. Tree equality proves identical CONTENT -- not identical history, the
      # same moment, or the same external world. governance/ci-reuse-policy.json classifies each step of this
      # gate `tree-pure` or `always`, tools/validate-ci-reuse-policy.py enforces that classification and FAILS
      # on any step nobody has classified, and the steps below carry the guard their classification requires.
      - name: Tree-equality evidence reuse
        id: reuse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_ENV_FINGERPRINT: ${{ steps.env.outputs.fingerprint }}
        run: bash scripts/ci/evidence-reuse.sh phase4-financial-core.yml
      - name: Initialise evidence staging
        if: steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$EVID/counts" "$EVID/logs"
          {
            printf 'head\t%s\n' "$(git rev-parse HEAD)"
            printf 'branch\t%s\n' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            printf 'run_id\t%s\n' "$GITHUB_RUN_ID"
            printf 'go\t%s\n' "$(go version)"
            printf 'postgres\t%s\n' "postgres:16-alpine (disposable, per gate)"
            printf 'start_utc\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVID/env.tsv"

      # ---------------------------------------------------------------- build / static
      - name: gofmt
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh gofmt -- bash $GITHUB_WORKSPACE/scripts/ci/gofmt-check.sh"

      - name: go build (./...)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-build -- go build ./..."

      - name: go vet (./...)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-vet -- go vet ./..."

      # ---------------------------------------------------------------- financial core: unit + race
      - name: Financial-core unit matrix
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        # PS golden wire, contract field order, no currency on the wire, the AS catalog, ambiguous-PA
        # refusal, the DARK guard, and the fail-closed gate matrix on synthetic snapshots.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-unit --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh phase4-unit
          ./internal/posting/ -count=1

      - name: Financial-core race detector
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        # The outbox lanes, the P# allocator and the review path are all concurrent. A data race in a money
        # path is a defect regardless of whether a test happened to observe it.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-race --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh phase4-race
          -race ./internal/posting/ ./internal/pmsd/ -count=1

      # ---------------------------------------------------------------- migrations
      - name: Migrations 0011-0026 + financial DB invariant gate (disposable PG16)
        if: steps.reuse.outputs.hit != 'true'
        # Includes the ENTIRE pre-0011 financial invariant suite, run on the pre-0011 chain and again after
        # the Phase-4 chain on a clean rebuild, so "nothing was weakened" is measured rather than asserted.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-migration -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh iam_v2_scratch/phase4_0011_financial.sh"

      # ---------------------------------------------------------------- payment concurrency
      - name: Payment concurrency proof (real concurrent PG16 sessions)
        if: steps.reuse.outputs.hit != 'true'
        # Its own gate rather than a step inside the DB gate: the proof backgrounds psql sessions, and
        # nesting it in a command substitution changes their scheduling -- exactly the timing dependence
        # this proof exists to rule out.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-payment-concurrency -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase4-payment-concurrency.sh"

      # ---------------------------------------------------------------- least privilege
      - name: Least-privilege boundary as real PostgreSQL roles (disposable PG16)
        if: steps.reuse.outputs.hit != 'true'
        # Runs AS sc_payment_runtime / sc_financial_operator / sc_financial_readonly and shows the refusals.
        # A grant file is a claim; this is the measurement.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-least-privilege -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase4-least-privilege.sh"

      # ---------------------------------------------------------------- restore
      - name: Supported restore drill (real pg_dump / pg_restore, disposable PG16)
        if: steps.reuse.outputs.hit != 'true'
        # Performs an ACTUAL dump-and-restore rather than faking the signal. It is the step that would have
        # caught the T0038 defect: the supported restore goes into the same cluster, so system_identifier
        # never changes and an identity-only detector sees nothing.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-restore-drill -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase4-restore-drill.sh"

      # ---------------------------------------------------------------- financial core against real PG
      - name: Financial-core PG16 integration matrix (disposable PG16)
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-integration -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase4-pg-integration.sh"

      # ---------------------------------------------------------------- DARK
      # The gate must be able to FAIL. A suite nobody has watched fail is a suite nobody has tested, and a
      # deterministic command error sitting inside a green run is worse than a red one.
      - name: Prove the integration gate reports a broken step
        if: steps.reuse.outputs.hit != 'true'
        env:
          PHASE4_SELFTEST_BREAK: recovery
        run: |
          if bash "$GITHUB_WORKSPACE/scripts/phase4-pg-integration.sh"; then
            echo "the integration gate PASSED with a deliberately broken step; it cannot be trusted"
            exit 1
          fi
          echo "the integration gate correctly failed on the broken step"

      - name: DARK assertion — no Phase-4 flag is enabled anywhere in the tree
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-dark -- bash $GITHUB_WORKSPACE/scripts/ci/phase4-dark-check.sh"

      # ---------------------------------------------------------------- Hotel-Admin financial operator UI
      # The operator screens are part of the Phase-4 software boundary: a recovery screen that grew a
      # "retry" button would be a way to double-charge a guest, and only a UI test catches that.
      - name: Install the Hotel-Admin toolchain
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        # package-lock.json is generated by a real `npm install` on LINUX (node:20-bookworm), not on the
        # Windows development host. sharp and the SWC binaries are optional platform packages, and npm's
        # ideal-tree differs per platform: a Windows-generated lock omits the hoisted @emnapi/core and
        # @emnapi/runtime that a Linux `npm ci` computes, and fails EUSAGE here. The Linux-generated lock is
        # a superset -- it carries every platform's binaries -- and `npm ci` reproduces it on both.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh hotel-admin-npm-ci -- npm ci"

      - name: Hotel-Admin typecheck
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh hotel-admin-typecheck -- npx tsc --noEmit"

      - name: Hotel-Admin unit tests (financial operator surface)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh hotel-admin-vitest -- npx vitest run --reporter=default"

      - name: Hotel-Admin production build with Phase-4 flags OFF
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        # The DELIVERED bundle. Building it with the flags off is what proves the financial screens are
        # absent from the shipped navigation rather than merely hidden by a runtime check.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh hotel-admin-build -- npx next build"

      - name: Install Chrome for the browser tests
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh playwright-install -- npx playwright install --with-deps chrome"

      - name: Hotel-Admin E2E — the FULL browser suite
        if: steps.reuse.outputs.hit != 'true'
        working-directory: hotel-admin
        # The whole suite, not only the Phase-4 spec: a financial milestone that regressed the PMS-interface
        # or guest-portal screens would still be a regression, and this is the gate that caught exactly that
        # when the Next 16 upgrade was attempted.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh hotel-admin-e2e -- npx playwright test --reporter=list"

      # ---------------------------------------------------------------- governance parity
      # The self-test first, for the same reason as the dependency gate: the parity validator passes on a
      # corrected state file, which is also what a validator that does nothing looks like. This drives the
      # real validator against the exact stale values found at T0041 and fails if it lets any of them pass.
      - name: Current-state parity self-test
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh state-parity-selftest -- bash $GITHUB_WORKSPACE/tools/validate-state-parity-selftest.sh"

      - name: Current-state claims match the repository
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh state-parity -- python3 $GITHUB_WORKSPACE/tools/validate-state-parity.py"

      # ---------------------------------------------------------------- dependency risk
      # The self-test runs FIRST. The gate itself passes on a clean tree, which is the state a gate that
      # does nothing is also in; this proves it refuses an unaccepted production advisory before its verdict
      # on the real tree is worth anything.
      - name: Dependency gate self-test
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-dependency-gate-selftest -- bash $GITHUB_WORKSPACE/scripts/ci/phase4-dependency-gate-selftest.sh"

      # NEVER REUSED, and it is the clearest case in the repository. This gate is a function of THREE inputs,
      # only one of which is the tree: `npm audit` queries the LIVE registry, so a tree that was clean
      # yesterday is vulnerable the moment an advisory is published against a dependency it already pins; and
      # dependency-judgement.py compares each acceptance's `expires_on` against TODAY, so an acceptance
      # lapsing overnight turns the same bytes from PASS into FAIL. Reusing a tree-keyed verdict here would
      # mean a newly published CVE, or an acceptance the Product Owner deliberately time-boxed, going
      # unreported on the commit that actually lands on master. The self-test above stays reuse-eligible: it
      # runs against fixtures and is a pure function of the tree.
      - name: Production dependency advisory gate
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-dependency-gate -- bash $GITHUB_WORKSPACE/scripts/ci/phase4-dependency-gate.sh"

      - name: Assemble the Phase-4 financial-core evidence artifact
        if: always() && steps.reuse.outputs.hit != 'true'
        run: python3 scripts/ci/phase4_evidence.py

      # See the Phase-3 workflow for why a reused verdict still publishes an artifact under its own commit.
      - name: Evidence pointer for a reused verdict
        if: steps.reuse.outputs.hit == 'true'
        env:
          REUSE_MATCHED_RUN: ${{ steps.reuse.outputs.matched_run }}
          REUSE_MATCHED_SHA: ${{ steps.reuse.outputs.matched_sha }}
          REUSE_MATCHED_AT: ${{ steps.reuse.outputs.matched_at }}
        run: bash scripts/ci/evidence-pointer.sh "$GITHUB_WORKSPACE/.phase4-evidence" "Phase-4 Financial Core CI"

      - name: Record the HEAD for the artifact name
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the Phase-4 financial-core evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-financial-core-evidence-${{ steps.head.outputs.sha }}
          path: ${{ github.workspace }}/.phase4-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
