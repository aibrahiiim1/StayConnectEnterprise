name: Phase 3 Software CI

# THE FULL Phase-3 software gate. One workflow run, one HEAD, every mandatory software test — backend AND
# frontend — followed by an evidence artifact assembled from the real run and uploaded from inside this job.
#
# It is deliberately NOT the old pmsd-only gate. It runs: gofmt over the whole Phase-3 Go surface; go build;
# full go vet; the entire Go unit suite; the race detector over every Phase-3 concurrency-sensitive package;
# the Migration 0010 lifecycle + concurrency gate; all eleven disposable-PG16 integration suites; the offline
# preflight; and — from the real hotel-admin directory under a locked Node install — TypeScript typecheck,
# Vitest, the production build with Phase-3 flags OFF, and the Playwright browser suite (which builds and
# exercises the guest-portal real template and the Hotel-Admin pages, with accessibility checks).
#
# A disposable-PG gate may retry ONCE on an exit-2 infrastructure failure; an exit-1 assertion failure is
# final. No required integration is allowed to silently skip: the runner installs everything it needs, and a
# missing tool fails the step. Test totals in the artifact come from each runner's own machine reporter on
# this run — never hand-typed, never a workstation number.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-full-software-gate:
    name: phase3-full-software-gate
    runs-on: ubuntu-latest
    env:
      EVID: ${{ github.workspace }}/.phase3-evidence
      ART: ${{ github.workspace }}/.phase3-artifact
    steps:
      # Check out the PR HEAD itself (not the merge commit), so the evidence artifact's embedded delivery
      # HEAD equals the exact commit under test.
      - name: Check out the PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: data-plane/go.sum

      - name: Set up Node (locked)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hotel-admin/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialise evidence staging
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$EVID/counts" "$EVID/logs"
          export START_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DELIVERY_HEAD="$(git rev-parse HEAD)"
          INVENTORY_HEAD="$(python3 -c "import json;print(json.load(open('governance/project-state.json'))['acceptance_candidate_head'])")"
          BASE_HEAD="$(grep -m1 'Base commit' docs/manifests/Phase3-change-manifest.md | grep -oE '[0-9a-f]{40}' || echo '')"
          python3 - "$DELIVERY_HEAD" "$INVENTORY_HEAD" "$BASE_HEAD" <<'PY'
          import json, os, sys
          delivery, inventory, base = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = {
            "delivery_head": delivery, "inventory_head": inventory, "base_head": base,
            "branch": os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME"),
            "pr_number": os.environ.get("PR_NUMBER") or "",
            "repository": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "job": os.environ.get("GITHUB_JOB"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "start_utc": os.environ.get("START_UTC"),
          }
          with open(os.path.join(os.environ["EVID"], "env.json"), "w") as f:
              json.dump(meta, f, indent=2)
          PY
          {
            printf 'go\t%s\n' "$(go version)"
            printf 'node\t%s\n' "$(node -v)"
            printf 'npm\t%s\n' "$(npm -v)"
            printf 'python\t%s\n' "$(python3 -V)"
            printf 'postgres\t%s\n' "postgres:16-alpine (disposable, per gate)"
          } > "$EVID/tool-versions.tsv"
          cat > "$EVID/commands.txt" <<'CMDS'
          Executed gate commands (in order):
            gofmt:                bash scripts/ci/gofmt-check.sh                        (cwd data-plane)
            go build:             go build ./...                                        (cwd data-plane)
            go vet:               go vet ./...                                          (cwd data-plane)
            go unit:              go test ./... -count=1                                (cwd data-plane, JSON-counted)
            go race:              go test -race <phase-3 concurrency packages> -count=1 (cwd data-plane, JSON-counted)
            migration lifecycle:  bash iam_v2_scratch/phase3_0010_lifecycle.sh
            PG16 integration:     bash scripts/pmsd-pg-integration.sh                   (all eleven suites)
            preflight:            bash scripts/phase3-preflight.sh --json
            enforcement suite:    go test ./cmd/netd/ ./internal/nft/ -run 'System|...' (JSON-counted)
            provisioning suite:   go test ./cmd/netd/ ./internal/shape/ -run 'Provision|...' (JSON-counted)
            npm ci:               npm ci                                               (cwd hotel-admin)
            typecheck:            npx tsc --noEmit                                      (cwd hotel-admin)
            vitest:               npx vitest run --reporter=default --reporter=json     (cwd hotel-admin)
            production build:     npx next build   (Phase-3 flags OFF)                  (cwd hotel-admin)
            playwright browsers:  npx playwright install --with-deps chrome             (cwd hotel-admin)
            playwright:           npx playwright test --reporter=list,json              (cwd hotel-admin)
          CMDS

      # ---------------------------------------------------------------- backend / runtime
      - name: gofmt (whole Phase-3 Go surface)
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh gofmt -- bash $GITHUB_WORKSPACE/scripts/ci/gofmt-check.sh"

      - name: go build (./...)
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-build -- go build ./..."

      - name: go vet (./...)
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-vet -- go vet ./..."

      - name: go test (all packages)
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-unit -- bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh go-unit ./... -count=1"

      # The PRODUCTION binary is a different compilation: `-tags stayconnect_production` locks the guest IAM
      # authority to IAM-v2 so no configuration can select the superseded path. Built and tested here as well
      # as the development build, because a production-only build tag that CI never compiles is a build tag
      # nobody has proven.
      - name: go build + test (production build tag)
        working-directory: data-plane
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-production-build --
          bash -c "go build -tags stayconnect_production ./... && go vet -tags stayconnect_production ./... && go test -tags stayconnect_production ./internal/iamv2/... -count=1"

      # THE FACTORY-CLEAN PRODUCTION BASELINE. A new appliance is built from the baseline, not from the
      # historical migrations, and must never construct the superseded guest-IAM tables -- not even
      # transiently. The verifier arms a DDL event trigger on the empty database before the first object
      # exists, so a baseline that built one cannot finish, and then compares the resulting catalog fact by
      # fact against the upgrade path's end state so the two cannot drift.
      # Both paths, in order: the upgrade path first so its catalog exists, then the baseline,
      # which compares itself against it. Running the baseline alone would still prove "never
      # constructed" but would silently skip the agreement check, and drift between the two is
      # the failure that matters most.
      - name: Factory-clean Production baseline (current-only, disposable PG)
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh factory-clean-baseline --
          bash -c "bash $GITHUB_WORKSPACE/scripts/clean-install-reconstruction.sh &&
                   bash $GITHUB_WORKSPACE/scripts/factory-clean-baseline-verify.sh"

      # A grant written only in a migration is removed by the first Gate-P reconcile and never comes back,
      # because gatep-grants.sql revokes all iam_v2 privilege before re-granting exactly what its per-service
      # files name. That silently disabled the expiry sweep on a live appliance. This proves the privileges
      # the services need are named where the reconcile will keep them.
      - name: Gate-P grants survive a reconcile (disposable PG)
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh gatep-grant-survives-reconcile --
          bash $GITHUB_WORKSPACE/scripts/gatep-grant-survives-reconcile.sh

      # The prior question to "do the right grants survive": can running the reconcile hurt anything. Proves
      # it is atomic under a deliberate mid-run failure, idempotent, that svc_pmsd holds no direct grace
      # mutation path, that PUBLIC holds no auth predicate, and that a stale or incomplete source set is
      # refused before a transaction opens.
      - name: Gate-P reconcile is safe to run (disposable PG)
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh gatep-reconcile-acceptance --
          bash $GITHUB_WORKSPACE/scripts/gatep-reconcile-acceptance.sh

      - name: go test -race (all Phase-3 concurrency-sensitive paths)
        working-directory: data-plane
        # pmsd, resolver, auth context, stay grant, checkout, scd, acctd, netd, and the controlled-writer guard.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-race --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh go-race
          ./internal/pmsd/... ./internal/pms/... ./internal/stayengine/... ./internal/pmsresolve/...
          ./internal/authctx/... ./internal/grace/... ./internal/checkout/... ./internal/staygrant/...
          ./internal/enforce/... ./internal/writerguard/... ./internal/shape/... ./internal/shapeplan/...
          ./cmd/scd/... ./cmd/acctd/... ./cmd/netd/... -count=1

      - name: Migration 0010 lifecycle + concurrency gate (disposable PG16)
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh migration-lifecycle -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh iam_v2_scratch/phase3_0010_lifecycle.sh"

      - name: PG16 integration — all eleven Phase-3 suites (disposable PG16)
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh pg16-integration -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/pmsd-pg-integration.sh"

      # THE PRODUCTION PRIVILEGE HARNESS, separate on purpose. The step above asserts the DARK posture, in
      # which svc_scd holds no runtime grants; this one builds a production-like database from the real Gate-P
      # files and runs the prodprivilege tag against it. Two privilege defects reached production because no
      # suite ever ran as a real service role -- this is the step that would have caught both.
      - name: Production privilege model (real Gate-P roles, disposable PG16)
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh prod-privilege -- bash $GITHUB_WORKSPACE/scripts/prod-privilege-integration.sh"

      - name: Phase-3 offline preflight
        run: |
          set -euo pipefail
          mkdir -p "$EVID/counts"
          start="$(date -u +%s)"
          # --json emits the structured {pass,fail,checks}; capture it as the count, and gate on fail==0.
          bash scripts/phase3-preflight.sh --json | tee "$EVID/counts/preflight.json"
          rc="${PIPESTATUS[0]}"
          end="$(date -u +%s)"
          printf 'preflight\t%d\t%d\n' "$rc" "$((end-start))" >> "$EVID/steps.tsv"
          exit "$rc"

      - name: Network-enforcement system tests (nft authorization + accountable tc + Session + durable bounds)
        working-directory: data-plane
        # The system-boundary suite: nft and tc modelled as the separate mechanisms they are, plus the
        # command contracts for the real nft/tc strings, the hard-boundary lease precision matrix, and the
        # write-ahead durable bound on an unproven activation, and the monotonic security-time suite. Counted
        # on its own so the evidence artifact
        # carries an explicit total for the enforcement contract rather than burying it inside the unit total.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh enforcement --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh enforcement
          ./cmd/netd/ ./internal/nft/
          -run 'System|Lease|Activation|Durable|SecurityTime|BootID|Journal|Phase3Allow|LegacyAllow|Phase3Deny|Phase3List|PermanentConcat|AuthorizedIn|ListIn|ConcatProbe|AllowInCarries' -count=1

      - name: Ruleset-durability tests (restart/reboot convergence, carry-over, fingerprint)
        working-directory: data-plane
        # The Live Increment-9 blocker: netd replayed a stored bundle rendered by an older binary and deleted
        # phase3_auth_ipv4 on every start. Counted on its own because "a routine restart executes NO nft
        # mutation" is the production invariant, and the evidence artifact should carry its own total for it
        # rather than burying it in the unit count.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh durability --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh durability
          ./internal/nftconverge/ ./internal/netcfg/ ./cmd/netd/
          -run 'Reconcile|Render_|Converge' -count=1

      - name: Verified binary rollback tool (false-PASS regression)
        # Increment 9's rehearsal replaced binaries with cp, every replacement failed with "Text file busy",
        # and it then reported PASS because the services were active. These tests are the standing proof that
        # the tool can no longer report success without having changed the running process image.
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh binary-rollback -- bash $GITHUB_WORKSPACE/scripts/ci/binary-rollback-tests.sh"

      - name: Surgical live-dark nft foundation tests
        working-directory: data-plane
        # The install/rollback that has to be safe on an appliance carrying live legacy guests. Counted on its
        # own because it is the operation an operator will run during Increment 9, and its result is the thing
        # they need to be able to point at.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh foundation --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh foundation
          ./internal/nftfoundation/ -count=1

      - name: REAL-KERNEL contract suite (disposable Linux network namespaces)
        # Real nft, real tc, real packets, in namespaces created and destroyed by the step. This is where the
        # kernel assumptions the whole design rests on are actually checked — that a lease expires with nothing
        # running, that a repeated `add` does not refresh it, that removing a tc filter denies nobody, and that
        # the surgical foundation preserves a populated legacy authorization set.
        #
        # It contacts no appliance, no production database and no PMS, and it verifies that the host's own
        # ruleset is byte-identical afterwards.
        run: "sudo -E env PATH=$PATH EVID=$EVID bash $GITHUB_WORKSPACE/scripts/ci/step.sh kernel-netns -- bash $GITHUB_WORKSPACE/scripts/ci/kernel-netns-suite.sh"

      - name: Staged-provisioning failure tests (accountable before forwarding)
        working-directory: data-plane
        # The adversarial provisioning suite (netd) and the command-level staged shape suite, counted on their
        # own so the evidence artifact carries an explicit result for the accountable-before-forwarding work.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh provisioning --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh provisioning
          ./cmd/netd/ ./internal/shape/
          -run 'Provision|Prepare|Activate|ReRate|Abort|Deny|SessionForwarding' -count=1

      # The enforcement plane is what turns a granted Session into access. A surface enabled without it is the
      # state that granted two real guests entitlements and sessions nothing ever enforced, so the checker that
      # refuses that combination is itself proven here rather than trusted.
      - name: Phase-3 enforcement-plane coherence checker (selftest)
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh enforcement-plane-check --
          bash $GITHUB_WORKSPACE/deploy/scripts/check-phase3-enforcement-plane-selftest.sh

      # A unit whose ExecStart does not exist fails 203/EXEC on every trigger, silently.
      # stayconnect-backup-cleanup.service did exactly that for weeks: retention never ran, the appliance root
      # filesystem reached 100%, and PostgreSQL could not write postmaster.pid. The installer now derives its
      # helper list from the units and verifies every Exec directive before installing anything; this proves
      # it, including the missing-executable condition that caused the outage.
      - name: Service-unit installer — helper installation and verification (selftest)
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh unit-installer-check --
          bash $GITHUB_WORKSPACE/deploy/scripts/install-service-units-selftest.sh

      # ---------------------------------------------------------------- Hotel Admin / Guest Portal
      - name: npm ci (locked dependencies)
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh npm-ci -- npm ci"

      - name: TypeScript typecheck
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh tsc -- npx tsc --noEmit"

      - name: Vitest
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh vitest -- npx vitest run --reporter=default --reporter=json --outputFile=$EVID/counts/vitest.json"

      - name: Production build (Phase-3 flags OFF)
        working-directory: hotel-admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh next-build -- npx next build"

      - name: Install Playwright browser
        working-directory: hotel-admin
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh playwright-install -- npx playwright install --with-deps chrome"

      - name: Playwright (Hotel-Admin + guest-portal real template + a11y)
        working-directory: hotel-admin
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.phase3-evidence/counts/playwright.json
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh playwright -- npx playwright test --reporter=list,json"

      # ---------------------------------------------------------------- evidence
      - name: Assemble the Phase-3 evidence artifact
        id: evidence
        run: python3 scripts/ci/phase3_evidence.py

      - name: Record the delivery HEAD for the artifact name
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the Phase-3 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-software-evidence-${{ steps.head.outputs.sha }}
          path: ${{ github.workspace }}/.phase3-artifact
          # The staging dir is dot-prefixed, so upload-artifact v4 treats its contents as hidden and would
          # otherwise skip them ("No files were found"). The files inside are the derived, PII-free evidence
          # summaries — nothing secret — so including them is correct.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
