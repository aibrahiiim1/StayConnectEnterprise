name: Project Governance

# Repository-side enforcement layer for the permanent GitHub execution/delivery rule
# (docs/GITHUB_EXECUTION_AND_DELIVERY_RULE.md, decision GH-MANDATORY-CI).
# Governance/validation only — no deployment, no database access, no migrations, no
# production tests. Read-only repository permissions.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  # workflow_dispatch is DELIBERATELY ABSENT from this gate.
  #
  # A dispatched run reports a check with the SAME NAME as the pull_request run, because a required status
  # context IS the job name. That has two consequences, both of which cost this project real delivery time:
  # a dispatched run in progress blocks the merge of a PR whose own checks are already green, and a
  # dispatched SUCCESS is a candidate the evidence-reuse lookup can inherit -- so a required check could be
  # satisfied by a run that never evaluated a pull request. The gate must be earned on the event that
  # actually proposes the change. To re-run after a genuine correction, re-run the FAILED JOBS of the
  # pull_request run; do not dispatch a fresh one.

# ---------------------------------------------------------------------------------------------------------
# ONE RUN PER REF, AND A SUPERSEDED RUN IS CANCELLED INSTEAD OF BEING LEFT TO FINISH.
#
# Without this key -- and until now there was no `concurrency:` key in ANY of the four gate workflows -- every
# push to a PR branch started a run that nothing ever stopped. The runs for the abandoned commits kept a
# runner busy, kept writing evidence, and kept reporting a check whose name is REQUIRED, so an obsolete run
# could still be "in progress" for an old commit while the branch had already moved on.
#
# cancel-in-progress is deliberately TRUE ONLY FOR pull_request. A push to master must never be cancelled:
# master's green record is the thing the protection rule reads, and cancelling it would leave the default
# branch with a check that is neither passing nor failing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MEASURE THE MACHINE BEFORE DECIDING WHETHER TO TRUST AN EARLIER ONE. `ubuntu-latest`, `Python 3.12` and
      # version-tagged actions all resolve at run time, so an identical tree says nothing about the toolchain
      # that would run the tests. This publishes a fingerprint of the resolved environment; the lookup below
      # reads the candidate run's own fingerprint out of its log and refuses to reuse across a difference.
      - name: Execution-environment fingerprint
        id: env
        # No image arguments: governance runs no container, so it resolves no image digests and stays off the registry.
        run: bash scripts/ci/env-fingerprint.sh

      # HAS THIS EXACT CONTENT ALREADY BEEN PROVEN GREEN BY THIS GATE?
      #
      # Every delivery validated twice: once on the pull-request head, once on the merge commit. Across the
      # last thirteen merges the merge commit's TREE was byte-identical to the PR head's tree in all
      # thirteen -- a merge introduces a commit, not content -- so the second run re-derived a verdict it
      # already held, on the critical path, for about half an hour.
      #
      # The lookup is keyed by GIT TREE HASH and answered from GitHub's own run history. An identical tree
      # is identical content in every tracked path, and .github/workflows, tools/ and governance/ are all
      # tracked -- so it is also the same gate definition running the same validators over the same inputs.
      # A changed check is a changed tree, and a changed tree never matches. Every failure path reports no
      # hit, so the full validation runs.
      - name: Tree-equality evidence reuse
        id: reuse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_ENV_FINGERPRINT: ${{ steps.env.outputs.fingerprint }}
        run: bash scripts/ci/evidence-reuse.sh project-governance.yml

      # THE GUARD ON THE GUARD, and the first thing checked after the lookup. Reuse skips work on the claim
      # that a step's verdict is a pure function of the tree. That claim was assumed for every step when reuse
      # was introduced, and it was FALSE for four of them: the two transition-timing checks read the commit
      # graph, the keyword validator checks a commit's existence, and the Phase-4 dependency gate queries the
      # live npm registry against today's date. This asserts that every step of every gate carries a recorded
      # classification and a guard that matches it, and FAILS on any step nobody has classified. It runs on
      # every run, hit or not, so a gate can never reuse evidence without first proving its own rules intact.
      - name: CI reuse policy — every gate step is classified
        run: python tools/validate-ci-reuse-policy.py

      # NEVER REUSED — it reads the LIVE protection of master from GitHub. The gap this closes was not a
      # missing rule but a missing check: the delivery rule required four gates while GitHub required one,
      # admins bypassed everything and force pushes were allowed, and nothing compared the two statements.
      # Now governance/branch-protection.json is the recorded model and this fails the gate the moment the
      # live configuration stops matching it — a dropped context, strict off, a bypass actor, evaluate-only
      # enforcement, widened merge methods. Unreachable means FAIL: unverifiable is not the same as fine.
      - name: Master protection matches the recorded model
        run: python tools/validate-branch-protection.py

      # The DELIVERY-SPEED half of the protection story, and it is checked from the tree, so it is tree-pure.
      #
      # validate-branch-protection.py asserts that the four gates are required and cannot be bypassed. It says
      # nothing about how a gate can be SATISFIED or how long a delivery waits for one. Both of those were
      # measurably wrong: no gate workflow carried a `concurrency:` key, so superseded runs were never
      # cancelled, and every gate accepted `workflow_dispatch`, so a dispatched run reported the same required
      # context as the real pull-request run -- blocking a merge while it finished, and offering its success
      # to the evidence-reuse lookup. This asserts both are fixed, and that the local preflight, its
      # documentation and the PR template still exist and still implement the checks they claim to.
      - name: Delivery protocol — concurrency, trigger hygiene, preflight coverage
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/validate-delivery-protocol.py

      # Does the enforcement above actually refuse the mistakes it exists to catch? A policy validator that
      # passes on a correct repository is indistinguishable from one that returns zero. This drives the real
      # validator against fixtures carrying each specific defect.
      - name: CI reuse policy — negative tests
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/tests/ci_reuse_policy/run_negative.py

      # And the protection check, watched failing. A local server impersonates GitHub and serves a weakened
      # configuration one defect at a time — hermetic, so this stays tree-pure.
      - name: Master protection — negative tests
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/tests/branch_protection/run_negative.py

      # And does the LOOKUP refuse what it claims to? It reports a hit on the delivery path, which is also
      # what a script returning "hit" unconditionally would do. This builds a real git repository with a known
      # topology, stubs only the run history, and makes exactly one eligibility rule false at a time.
      - name: Evidence-reuse eligibility self-test (ancestry, age, tree, fail-closed)
        if: steps.reuse.outputs.hit != 'true'
        run: bash scripts/ci/tests/evidence-reuse-selftest.sh

      - name: Structural project-state validation
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/project-state.py validate

      - name: Generated-block consistency
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/project-state.py check-generated

      # The rule that compares the generated appliance summary to the live counters, watched failing. It was
      # added after eight documents and three packs spent two days reporting "no guest has authenticated:
      # purchases=0, entitlements=0, sessions=0" about an appliance holding two real Room Logins and one
      # kernel-enforced session, with Governance green throughout.
      - name: Generated-block contradiction rules — negative tests
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/tests/generated_block_contradiction/run_negative.py

      # The merge-timing rule is grandfathered for T0054 on the real ledger, so a normal run reports it as a
      # listed exception and passes -- which is correct, and also indistinguishable from a rule that does
      # nothing. This drives the real validator with the grandfather list emptied and fails if the historical
      # defect gets through, so the rule is proven to bite BEFORE its verdict on the ledger is worth anything.
      # NEVER REUSED. It reads `git log -1 --format=%cI` for a real merge commit and drives the real validator
      # against the real ledger, so its verdict is a function of the COMMIT GRAPH, not of the tree.
      - name: Merge-receipt timing self-test (does the rule catch the T0054 defect?)
        run: bash tools/validate-merge-receipt-times-selftest.sh

      # NEVER REUSED, and this is the check that proved the first reuse design unsound. It asks git for the
      # commit that FIRST INTRODUCED each receipt and for the committer date of the merge commit a receipt
      # names -- neither of which the tree fixes. Two commits with identical content can have different
      # ancestry, so a verdict borrowed from one of them is a verdict about a different question.
      - name: Transition-receipt timestamps
        # Two rules. A receipt that claims a moment AFTER the commit that introduced it is describing its
        # own future. A receipt that records a pull-request merge and is dated BEFORE that merge is asserting
        # an event that had not happened -- which is what T0054 did, by 311 seconds. Checked here as well as
        # in the Zero-Stale validator because both need git history, which the extracted-pack mode of that
        # validator deliberately does not have.
        run: bash tools/validate-transition-times.sh

      - name: PR-metadata Zero-Stale (the one authoritative surface that is not committed)
        # Every other check stops at the repository boundary, so a PR whose top-level Status still announced a
        # superseded candidate state passed every gate while being the most visible wrong statement in the
        # delivery. This reads the PR body through the API IN THIS RUN and compares it with
        # governance/project-state.json. It hard-codes no run ids and no future values.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/validate-pr-metadata.sh

      # --require-full makes a case-limited run IMPOSSIBLE here: MUTATION_MAX_CASES is a test-only knob for
      # the isolation regression's short child runs, and the authoritative gate must never be satisfiable by
      # a partial matrix. The suite prints MUTATION_CASES_EXECUTED/TOTAL/LIMIT, and the step below asserts
      # from that output that the complete matrix ran with no limit active.
      - name: Adversarial mutation suite (COMPLETE matrix, no case limit)
        if: steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          python tools/tests/project_state_validator/run_mutations.py --require-full | tee /tmp/mutations.out
          line="$(grep -E '^MUTATION_CASES_EXECUTED=' /tmp/mutations.out || true)"
          [ -n "$line" ] || { echo "the suite printed no case-count line"; exit 1; }
          echo "  $line"
          ran="$(sed -E 's/.*MUTATION_CASES_EXECUTED=([0-9]+).*/\1/' <<<"$line")"
          total="$(sed -E 's/.*MUTATION_CASES_TOTAL=([0-9]+).*/\1/' <<<"$line")"
          limit="$(sed -E 's/.*MUTATION_CASE_LIMIT=([^ ]+).*/\1/' <<<"$line")"
          [ "$limit" = "none" ] || { echo "a case limit was active: $limit"; exit 1; }
          [ "$ran" = "$total" ] || { echo "only $ran of $total cases ran"; exit 1; }
          echo "  the complete matrix ran: $ran of $total cases, no limit"

      # The harness itself is adversarial software that used to mutate the canonical checkout. This proves
      # it cannot: concurrent runs, SIGTERM, a forced kill, and a failed sandbox all leave
      # governance/project-state.json byte-identical and the working tree unchanged.
      - name: Mutation-suite isolation regression (concurrency, forced kill, fail-closed)
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/tests/project_state_validator/run_isolation_regression.py

      # NEVER REUSED. Section 5 resolves the manifest's SOURCE_COMMIT against git and reports whether that
      # commit EXISTS -- an object-graph question the tree does not answer.
      - name: Zero-stale keyword validation
        run: bash tools/validate-project-state.sh

      - name: Current-state semantic parity (every current surface vs the recorded facts)
        if: steps.reuse.outputs.hit != 'true'
        # Keyword checks stop at vocabulary. This one compares MEANING: current_maturity said an authorization
        # was still awaited while current_activity said that authorization had been executed, and iam_v2 was
        # recorded as both 49 and 63 in the same file. Neither sentence contains a forbidden word; they are
        # only wrong about each other.
        run: python tools/validate-current-state-parity.py

      - name: Current-state parity — negative tests (the validator must catch what shipped before)
        if: steps.reuse.outputs.hit != 'true'
        # A validator that has only ever seen a passing repository is indistinguishable from one that returns
        # PASS unconditionally. Each case reintroduces a contradiction that actually shipped green.
        run: python tools/tests/current_state_parity/run_negative.py

      - name: Rendered current state must not contradict the canonical PMS state or re-date a snapshot
        if: steps.reuse.outputs.hit != 'true'
        # The first thing a reader opens said the PMS feed was "live and healthy" while project-state.json
        # correctly recorded it as intentionally stopped, and the same block presented a dated counter
        # snapshot as current totals. Every existing gate passed: they compared documents with each other,
        # not the rendered prose with the canonical transport state.
        run: python tools/tests/current_state_parity/run_pms_and_counter_staleness.py

      - name: Evidence-artifact staleness (a post-closure artifact must not describe finished work as pending)
        if: steps.reuse.outputs.hit != 'true'
        # The software artifact is the most authoritative file a reviewer opens, and it kept emitting the
        # 2026-08-10 Increment-9 snapshot — corrected_software_deployed=false and a five-item remaining-work
        # list — into artifacts generated after that work was finished, accepted and merged. This runs the real
        # generator and asserts that history is labelled history and current state comes from the recorded
        # facts, in BOTH directions: patched facts that say work remains must still produce an artifact that
        # says so, or "nothing remains" would just be hard-coded.
        run: python tools/tests/evidence_artifact/run_artifact_staleness.py

      - name: Tooling must carry no control characters
        if: steps.reuse.outputs.hit != 'true'
        # A heredoc turned an escape into a literal 0x08 inside two validator regexes. The file looked
        # correct, both regexes still compiled, the suite still reported PASS - and the alternatives they
        # guarded could never match. Only the bytes give that away, so the bytes are checked.
        run: python tools/tests/tooling/run_control_chars.py

      - name: The documented preflight suite SIZE is pass + fail, not pass
        if: steps.reuse.outputs.hit != 'true'
        # The stale-document check read the preflight JSON's "pass" count and used it as the suite TOTAL, so
        # a single red preflight check redefined the suite from 108 checks to 107 and reported the Final
        # Report's correct "PASS 108/108" as stale. It also crossed a line: whether the preflight PASSES is
        # Phase 3 Software CI's job. This drives the real validator against a stub preflight, offline.
        run: bash tools/tests/tooling/preflight-total-selftest.sh

      # NEVER REUSED. It asserts something about THIS RUNNER after THIS RUN's steps, not about the tree. The
      # always-run checks above still execute on a reuse hit, so there is still something for it to check.
      - name: Working tree must remain clean
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Working tree dirty after validation:"
            echo "$status"
            exit 1
          fi
          echo "clean"
