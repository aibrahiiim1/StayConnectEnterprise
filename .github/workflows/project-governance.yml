name: Project Governance

# Repository-side enforcement layer for the permanent GitHub execution/delivery rule
# (docs/GITHUB_EXECUTION_AND_DELIVERY_RULE.md, decision GH-MANDATORY-CI).
# Governance/validation only — no deployment, no database access, no migrations, no
# production tests. Read-only repository permissions.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural project-state validation
        run: python tools/project-state.py validate

      - name: Generated-block consistency
        run: python tools/project-state.py check-generated

      # The rule that compares the generated appliance summary to the live counters, watched failing. It was
      # added after eight documents and three packs spent two days reporting "no guest has authenticated:
      # purchases=0, entitlements=0, sessions=0" about an appliance holding two real Room Logins and one
      # kernel-enforced session, with Governance green throughout.
      - name: Generated-block contradiction rules — negative tests
        run: python tools/tests/generated_block_contradiction/run_negative.py

      # The merge-timing rule is grandfathered for T0054 on the real ledger, so a normal run reports it as a
      # listed exception and passes -- which is correct, and also indistinguishable from a rule that does
      # nothing. This drives the real validator with the grandfather list emptied and fails if the historical
      # defect gets through, so the rule is proven to bite BEFORE its verdict on the ledger is worth anything.
      - name: Merge-receipt timing self-test (does the rule catch the T0054 defect?)
        run: bash tools/validate-merge-receipt-times-selftest.sh

      - name: Transition-receipt timestamps
        # Two rules. A receipt that claims a moment AFTER the commit that introduced it is describing its
        # own future. A receipt that records a pull-request merge and is dated BEFORE that merge is asserting
        # an event that had not happened -- which is what T0054 did, by 311 seconds. Checked here as well as
        # in the Zero-Stale validator because both need git history, which the extracted-pack mode of that
        # validator deliberately does not have.
        run: bash tools/validate-transition-times.sh

      - name: PR-metadata Zero-Stale (the one authoritative surface that is not committed)
        # Every other check stops at the repository boundary, so a PR whose top-level Status still announced a
        # superseded candidate state passed every gate while being the most visible wrong statement in the
        # delivery. This reads the PR body through the API IN THIS RUN and compares it with
        # governance/project-state.json. It hard-codes no run ids and no future values.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/validate-pr-metadata.sh

      # --require-full makes a case-limited run IMPOSSIBLE here: MUTATION_MAX_CASES is a test-only knob for
      # the isolation regression's short child runs, and the authoritative gate must never be satisfiable by
      # a partial matrix. The suite prints MUTATION_CASES_EXECUTED/TOTAL/LIMIT, and the step below asserts
      # from that output that the complete matrix ran with no limit active.
      - name: Adversarial mutation suite (COMPLETE matrix, no case limit)
        run: |
          set -euo pipefail
          python tools/tests/project_state_validator/run_mutations.py --require-full | tee /tmp/mutations.out
          line="$(grep -E '^MUTATION_CASES_EXECUTED=' /tmp/mutations.out || true)"
          [ -n "$line" ] || { echo "the suite printed no case-count line"; exit 1; }
          echo "  $line"
          ran="$(sed -E 's/.*MUTATION_CASES_EXECUTED=([0-9]+).*/\1/' <<<"$line")"
          total="$(sed -E 's/.*MUTATION_CASES_TOTAL=([0-9]+).*/\1/' <<<"$line")"
          limit="$(sed -E 's/.*MUTATION_CASE_LIMIT=([^ ]+).*/\1/' <<<"$line")"
          [ "$limit" = "none" ] || { echo "a case limit was active: $limit"; exit 1; }
          [ "$ran" = "$total" ] || { echo "only $ran of $total cases ran"; exit 1; }
          echo "  the complete matrix ran: $ran of $total cases, no limit"

      # The harness itself is adversarial software that used to mutate the canonical checkout. This proves
      # it cannot: concurrent runs, SIGTERM, a forced kill, and a failed sandbox all leave
      # governance/project-state.json byte-identical and the working tree unchanged.
      - name: Mutation-suite isolation regression (concurrency, forced kill, fail-closed)
        run: python tools/tests/project_state_validator/run_isolation_regression.py

      - name: Zero-stale keyword validation
        run: bash tools/validate-project-state.sh

      - name: Current-state semantic parity (every current surface vs the recorded facts)
        # Keyword checks stop at vocabulary. This one compares MEANING: current_maturity said an authorization
        # was still awaited while current_activity said that authorization had been executed, and iam_v2 was
        # recorded as both 49 and 63 in the same file. Neither sentence contains a forbidden word; they are
        # only wrong about each other.
        run: python tools/validate-current-state-parity.py

      - name: Current-state parity — negative tests (the validator must catch what shipped before)
        # A validator that has only ever seen a passing repository is indistinguishable from one that returns
        # PASS unconditionally. Each case reintroduces a contradiction that actually shipped green.
        run: python tools/tests/current_state_parity/run_negative.py

      - name: Evidence-artifact staleness (a post-closure artifact must not describe finished work as pending)
        # The software artifact is the most authoritative file a reviewer opens, and it kept emitting the
        # 2026-08-10 Increment-9 snapshot — corrected_software_deployed=false and a five-item remaining-work
        # list — into artifacts generated after that work was finished, accepted and merged. This runs the real
        # generator and asserts that history is labelled history and current state comes from the recorded
        # facts, in BOTH directions: patched facts that say work remains must still produce an artifact that
        # says so, or "nothing remains" would just be hard-coded.
        run: python tools/tests/evidence_artifact/run_artifact_staleness.py

      - name: Tooling must carry no control characters
        # A heredoc turned an escape into a literal 0x08 inside two validator regexes. The file looked
        # correct, both regexes still compiled, the suite still reported PASS - and the alternatives they
        # guarded could never match. Only the bytes give that away, so the bytes are checked.
        run: python tools/tests/tooling/run_control_chars.py

      - name: Working tree must remain clean
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Working tree dirty after validation:"
            echo "$status"
            exit 1
          fi
          echo "clean"
