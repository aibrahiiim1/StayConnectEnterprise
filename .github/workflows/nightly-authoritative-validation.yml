name: Nightly Authoritative Validation

# ---------------------------------------------------------------------------------------------------------
# ONE COMPLETE AUTHORITATIVE VALIDATION PER NIGHT, AT 06:00 Africa/Cairo, AGAINST THE EXACT DELIVERY HEAD.
#
# Normal development is no longer interrupted. The four gate workflows DO run on `pull_request` -- that is the
# only event whose check runs satisfy a ruleset-required status check -- but attempt 1 executes a single step, a
# deliberate sentinel, and fails in seconds. The required context therefore EXISTS and does not PASS.
#
# Once a night this orchestrator RE-RUNS each gate's own `pull_request` run for the exact head of the single
# active delivery candidate. A re-run keeps `event=pull_request` and the same head SHA, so its checks count, and
# it arrives as attempt 2+, where the full gate executes. An all-green result on that exact head is merged
# automatically.
#
# A DISPATCH WAS TRIED FIRST AND THE PLATFORM REFUSED IT. Four dispatched runs put four green check runs under
# exactly the required context names, from the pinned Actions app, on the pull-request head -- and the ruleset
# answered `HTTP 405 ... 4 of 4 required status checks are expected`. Measured on PR #181. Do not reintroduce a
# dispatch trigger on a gate.
#
# ONE SCHEDULE, AND THE PLATFORM HANDLES THE TIMEZONE. GitHub Actions supports an IANA `timezone:` alongside
# `cron:`, so 06:00 Africa/Cairo is stated once and Egypt's DST -- UTC+2 in winter, UTC+3 from late April to
# late October -- is the platform's problem rather than this file's.
#
# WHAT THIS REPLACED, because the previous shape is worth knowing about if `timezone:` is ever removed: two
# crons at 00:10Z and 01:10Z, one per possible offset, with the orchestrator computing which firing was the
# real target local time and exiting as a no-op on the other. That worked, but it meant one deliberate no-op run
# every night, and the session-start check then had to tell a no-op from a real verdict -- because both exit
# zero. One timezone-aware entry removes the second firing, the no-op, and the reason for that distinction.
#
# The remaining schedule check is NOT that selection logic. It verifies the platform actually honoured the
# timezone: if `timezone:` were ignored, this would fire at 06:00 UTC, which is 08:00 or 09:00 in Cairo, and
# a silently mistimed nightly merge is exactly the kind of thing that goes unnoticed for months.
# ---------------------------------------------------------------------------------------------------------
on:
  schedule:
    # 06:00 Africa/Cairo, stated once. The platform resolves the offset, including across Egypt's DST
    # transitions; tools/nightly_delivery.py then verifies from the tz database that it really did.
    - cron: '0 6 * * *'
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      ignore_schedule_check:
        description: 'Run now regardless of the schedule sanity check. Changes only WHEN, never WHAT.'
        type: boolean
        default: false
      dry_run:
        description: 'Run the full four-gate validation and report the decision, but do not merge.'
        type: boolean
        default: false

# Never cancel a nightly run: it may already have re-run the gates, and a cancelled orchestrator would leave
# four runs in flight with nothing to read their verdict or merge on it.
concurrency:
  group: nightly-authoritative-validation
  cancel-in-progress: false

permissions:
  contents: write            # the protected merge
  pull-requests: write       # reading the candidate and merging it
  actions: write             # re-running each gate's pull_request run, and reading the results back

jobs:
  nightly:
    name: nightly-authoritative-validation
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The decision module and its tests are read from the DEFAULT BRANCH, not from the candidate. The
      # candidate is the thing under judgement; the judge must not be supplied by it.
      - name: Check out master (the judge, not the candidate)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The rules that can refuse a merge are proven before any of them is used tonight. If this fails,
      # nothing is re-run and nothing is merged.
      - name: Fail-closed proofs for tonight's decision rules
        run: python tools/tests/nightly_delivery/run_negative.py

      - name: Validate, and merge if all four gates freshly pass the exact head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_IGNORE_SCHEDULE_CHECK: ${{ inputs.ignore_schedule_check }}
          NIGHTLY_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/ci/nightly-orchestrate.py
