name: TEMPORARY - generate the factory-clean baseline

# TEMPORARY, BRANCH-ONLY, MANUAL. Delete before merge.
#
# scripts/generate-production-baseline.sh needs a working Docker engine AND a Go toolchain in the same
# environment. The workstation's Docker engine is unresponsive and the appliance has no Go toolchain and is
# not a development generator, so this borrows the one environment that already has both: the CI runner the
# Phase-3 gate itself uses.
#
# It runs the REPOSITORY'S OWN generator against the PR HEAD, changes nothing, and uploads what the generator
# wrote so it can be committed from a checkout that can read it. No live database, no appliance, no manual
# SQL, no hand-edited baseline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate-production-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # The same toolchain versions the Phase-3 gate pins, so the generator runs in the environment its
      # output will be verified in.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: data-plane/go.sum

      - name: Run the repository generator
        run: bash "$GITHUB_WORKSPACE/scripts/generate-production-baseline.sh"

      # Verify HERE as well as after committing: a baseline that only agrees with the upgrade path on the
      # machine that produced it is not evidence of anything.
      - name: Verify the generated baseline against the upgrade path
        run: bash "$GITHUB_WORKSPACE/scripts/factory-clean-baseline-verify.sh"

      - name: Show what changed
        run: |
          git --no-pager diff --stat -- data-plane/migrations/baseline/ || true
          echo "== catalog facts =="
          wc -l < "$GITHUB_WORKSPACE/.cleanroom/catalog.txt" || true

      - name: Upload the generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: generated-baseline
          if-no-files-found: error
          path: |
            data-plane/migrations/baseline/
            .cleanroom/catalog.txt
