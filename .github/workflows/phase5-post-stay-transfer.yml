name: Phase 5 Post-Stay and Transfer CI

# The authoritative automated gate for Phase 5 (Post-Stay PIN re-authentication and the Cross-PMS Transfer
# workflow). It runs on the exact HEAD under test and produces machine-verifiable evidence — never a
# hand-typed number and never a workstation result.
#
# What it proves, in order:
#   1. the tree builds, vets and formats clean;
#   2. the Phase-5 unit matrix passes, including the flag loader's dark default and its refusal of a child
#      flag without its master;
#   3. NOTHING in the deployment surface enables a Phase-5 flag;
#   4. migrations 0027-0029 apply on the authoritative chain, and the Phase-5 database gates pass:
#      foundation + security, the migration lifecycle (UP / erroring re-apply / DOWN / DOWN->UP judged on the
#      STRUCTURAL fingerprint), and a DERIVED least-privilege proof;
#   5. the Phase-5 integration matrix passes against a real PostgreSQL — F8 (post-stay, written as attacks),
#      F9 (transfer, including 24-way concurrency and the opposite-direction deadlock proof), and the
#      contractual F9-i race against the REAL Phase-3 checkout/grace conversion;
#   6. the Phase-3 and Phase-4 suites still pass, because Phase 5 extends a Phase-3 guard and must not have
#      weakened anything either phase established;
#   7. and it PUBLISHES the evidence, fail-closed. The first four milestones of this gate were green and
#      produced no artifact at all, which is a measured defect and not a hypothetical one -- see the
#      evidence-publication block at the end of this file.
#
# It contacts no appliance, no Production database, no PMS and no payment provider. Every database it uses is
# a disposable container it creates and destroys itself.

# The phase branch is in the trigger list deliberately, for the same reason as Phase 4: workflow_dispatch
# cannot reach a workflow that does not yet exist on the default branch, and the delivery rule is one branch
# and ONE eventual PR — so without this the only way to obtain authoritative CI for work in progress would be
# to open a PR early or to merge, and neither is authorized.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, 'phase/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-post-stay-transfer-gate:
    name: phase5-post-stay-transfer-gate
    runs-on: ubuntu-latest
    env:
      EVID: ${{ github.workspace }}/.phase5-evidence
    steps:
      - name: Check out the HEAD under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: data-plane/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The publisher is fail-closed, and a fail-closed component that has only ever been watched succeeding
      # has not been shown to fail-close. This runs FIRST, before any gate can make the staging directory
      # look complete, and drives the real assembler against deliberately incomplete inputs.

      # MEASURE THE MACHINE BEFORE DECIDING WHETHER TO TRUST AN EARLIER ONE. `ubuntu-latest`, `Go 1.25, Python 3.12` and
      # version-tagged actions all resolve at run time, so an identical tree says nothing about the toolchain
      # that would run the tests. This publishes a fingerprint of the resolved environment; the lookup below
      # reads the candidate run's own fingerprint out of its log and refuses to reuse across a difference.
      - name: Execution-environment fingerprint
        id: env
        run: bash scripts/ci/env-fingerprint.sh postgres:16-alpine

      # HAS THIS EXACT CONTENT ALREADY BEEN PROVEN GREEN BY THIS GATE, IN AN EQUIVALENT CONTEXT?
      #
      # This exists because the merge commit's tree was byte-identical to the pull-request head's tree in
      # thirteen of the last thirteen merges: the second run was re-deriving a verdict it already held.
      #
      # A HIT REQUIRES FOUR THINGS, not just a matching tree. The same workflow; an IDENTICAL TREE (and this
      # file, the scripts it calls and the sources under test are all tracked, so a changed check is a
      # changed tree and a changed tree never matches); ANCESTRY, so evidence from an unrelated branch that
      # happens to render the same content can never be borrowed; and RECENCY, so an old verdict cannot be
      # resurrected for content that returns later. Every failure path reports no hit and the full gate runs.
      #
      # A HIT DOES NOT SKIP EVERYTHING. Tree equality proves identical CONTENT -- not identical history, the
      # same moment, or the same external world. governance/ci-reuse-policy.json classifies each step of this
      # gate `tree-pure` or `always`, tools/validate-ci-reuse-policy.py enforces that classification and FAILS
      # on any step nobody has classified, and the steps below carry the guard their classification requires.
      - name: Tree-equality evidence reuse
        id: reuse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_ENV_FINGERPRINT: ${{ steps.env.outputs.fingerprint }}
        run: bash scripts/ci/evidence-reuse.sh phase5-post-stay-transfer.yml
      - name: Evidence-publication self-test (does the publisher refuse an incomplete run?)
        if: steps.reuse.outputs.hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/phase5-evidence-selftest.sh"

      - name: Initialise evidence staging
        if: steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$EVID/counts" "$EVID/logs"
          {
            printf 'head\t%s\n' "$(git rev-parse HEAD)"
            printf 'branch\t%s\n' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            printf 'run_id\t%s\n' "$GITHUB_RUN_ID"
            printf 'go\t%s\n' "$(go version)"
            printf 'postgres\t%s\n' "postgres:16-alpine (disposable, per gate)"
            printf 'start_utc\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVID/env.tsv"

      # ---------------------------------------------------------------- build / static
      - name: gofmt
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh gofmt -- bash $GITHUB_WORKSPACE/scripts/ci/gofmt-check.sh"

      - name: go build (./...)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-build -- go build ./..."

      - name: go vet (./...)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-vet -- go vet ./..."

      - name: go vet (integration && phase5)
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh go-vet-phase5 -- go vet -tags 'integration phase5' ./..."

      # ---------------------------------------------------------------- unit matrix (counted)
      - name: Phase-5 unit matrix
        if: steps.reuse.outputs.hit != 'true'
        working-directory: data-plane
        # The flag loader's dark default and its refusal of a child flag without its master, and the strict
        # guest decoder. internal/codegen carries no tests of its own -- it is listed because the PIN
        # alphabet is exercised through the packages that use it, and a package that stops compiling must
        # fail here rather than at deployment. Run through the counted wrapper so the evidence artifact
        # carries a machine test total produced by the SAME run that gated -- never a second, weaker one.
        run: >
          bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase5-unit --
          bash $GITHUB_WORKSPACE/scripts/ci/go-test-counted.sh phase5-unit
          ./cmd/portald/ ./internal/iamv2/ ./internal/codegen/ -count=1

      # ---------------------------------------------------------------- dark posture
      - name: Phase-5 DARK guard
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase5-dark-guard -- bash $GITHUB_WORKSPACE/scripts/phase5-dark-guard.sh"

      # ---------------------------------------------------------------- database gates + integration
      - name: Phase-5 database gates and integration matrix
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase5-integration -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase5-pg-integration.sh"

      # ---------------------------------------------------------------- prior-phase regression
      - name: Phase-4 financial-core regression
        if: steps.reuse.outputs.hit != 'true'
        run: "bash $GITHUB_WORKSPACE/scripts/ci/step.sh phase4-regression -- bash $GITHUB_WORKSPACE/scripts/ci/pg-gate.sh scripts/phase4-pg-integration.sh"

      # ---------------------------------------------------------------- evidence publication (fail-closed)
      # This gate ran green for four milestones and published NOTHING. Three things conspired: the staging
      # directory is dot-prefixed and upload-artifact@v4 skips hidden files; `if-no-files-found: warn`
      # demoted "the evidence does not exist" to a log line; and nothing assembled or checked the evidence
      # before uploading it. A green run with no artifact is indistinguishable from a green run whose
      # evidence was never produced, so every one of those three is closed below.
      - name: Assemble the Phase-5 evidence artifact
        if: always() && steps.reuse.outputs.hit != 'true'
        run: python3 scripts/ci/phase5_evidence.py

      # See the Phase-3 workflow for why a reused verdict still publishes an artifact under its own commit.
      # This gate is also the one with a publisher that REFUSES an incomplete run, which is exactly why a hit
      # writes a pointer rather than assembling something out of an empty staging directory.
      - name: Evidence pointer for a reused verdict
        if: steps.reuse.outputs.hit == 'true'
        env:
          REUSE_MATCHED_RUN: ${{ steps.reuse.outputs.matched_run }}
          REUSE_MATCHED_SHA: ${{ steps.reuse.outputs.matched_sha }}
          REUSE_MATCHED_AT: ${{ steps.reuse.outputs.matched_at }}
        run: bash scripts/ci/evidence-pointer.sh "$GITHUB_WORKSPACE/.phase5-evidence" "Phase-5 Post-Stay and Transfer CI"

      - name: Record the HEAD for the artifact name
        if: always()
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the Phase-5 evidence artifact
        if: always()
        id: publish
        uses: actions/upload-artifact@v4
        with:
          name: phase5-post-stay-transfer-evidence-${{ steps.head.outputs.sha }}
          path: ${{ github.workspace }}/.phase5-evidence
          # The staging dir is dot-prefixed, so upload-artifact v4 treats its contents as hidden and would
          # otherwise skip them ("No files were found") -- which is exactly what happened. The files inside
          # are derived, PII-free summaries; including them is correct.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # The upload action's own outputs, asserted. `if-no-files-found: error` covers an empty upload, but the
      # claim this project makes to the Product Owner is "there is a downloadable artifact with this ID and
      # this digest" -- so the ID and the digest are read back from the action that created them and the job
      # fails if either is absent.
      - name: Prove the artifact really exists
        if: always()
        env:
          ART_ID: ${{ steps.publish.outputs.artifact-id }}
          ART_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
          ART_URL: ${{ steps.publish.outputs.artifact-url }}
        run: |
          set -euo pipefail
          echo "artifact_id=${ART_ID:-<none>}"
          echo "artifact_sha256=${ART_DIGEST:-<none>}"
          echo "artifact_url=${ART_URL:-<none>}"
          [ -n "${ART_ID:-}" ]     || { echo "the evidence artifact has no ID: nothing was published"; exit 1; }
          [ -n "${ART_DIGEST:-}" ] || { echo "the evidence artifact has no digest: nothing was published"; exit 1; }
          {
            echo "### Phase-5 evidence artifact"
            echo ""
            echo "- head: \`${{ steps.head.outputs.sha }}\`"
            echo "- artifact id: \`$ART_ID\`"
            echo "- sha256: \`$ART_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
