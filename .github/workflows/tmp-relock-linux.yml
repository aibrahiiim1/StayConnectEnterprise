name: TEMPORARY relock on Linux

# TEMPORARY, AND REMOVED BEFORE THIS BRANCH MERGES.
#
# docs/PHASE4_DEPENDENCY_TRIAGE.md records a measured fact: hotel-admin/package-lock.json must be produced by
# a real npm install on LINUX. sharp and the SWC binaries are optional platform packages and npm's ideal tree
# differs per platform -- a Windows-generated lock omits the hoisted @emnapi/core and @emnapi/runtime that a
# Linux npm ci computes, and CI then fails "EUSAGE - package.json and package-lock.json are not in sync".
#
# The development host has no working Linux toolchain right now (its Docker daemon is unresponsive), so the
# lock for the next 15.5.23 -> 15.5.24 security update is generated on the same Linux runner CI itself uses
# and downloaded from here. This workflow generates an artifact and nothing else: it does not gate, deploy,
# publish or touch any environment.

on:
  workflow_dispatch:
  push:
    branches: [ fix/next-15-5-24-security ]

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the lockfile from package.json on Linux
        working-directory: hotel-admin
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          node -e "
            const l=require('./package-lock.json');
            const p=l.packages;
            console.log('next      :', p['node_modules/next'].version);
            console.log('sharp     :', p['node_modules/sharp'].version);
            console.log('@emnapi/core   hoisted:', !!p['node_modules/@emnapi/core']);
            console.log('@emnapi/runtime hoisted:', !!p['node_modules/@emnapi/runtime']);
          "

      - name: Prove npm ci reproduces it on Linux, then prove it stays byte-identical
        working-directory: hotel-admin
        run: |
          set -euo pipefail
          sha_before="$(sha256sum package-lock.json | cut -d' ' -f1)"
          npm ci --no-audit --no-fund
          sha_after="$(sha256sum package-lock.json | cut -d' ' -f1)"
          echo "lock sha256 before npm ci: $sha_before"
          echo "lock sha256 after  npm ci: $sha_after"
          [ "$sha_before" = "$sha_after" ] || { echo "npm ci rewrote the lockfile"; exit 1; }
          node -e "const s=require('sharp'); console.log('sharp', s.versions.sharp, 'libvips', s.versions.vips);"

      - name: Production dependency advisory gate, on the Linux tree
        run: bash scripts/ci/phase4-dependency-gate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hotel-admin-package-lock-linux
          path: hotel-admin/package-lock.json
          retention-days: 1
