# The service journal is archived at least daily, so scd's hourly `journalctl --vacuum-time` (the site's system-log
# period, Hotel Admin -> Backups -> Data retention; GDPR plan F5, migration 0134) can remove each day once it is
# older than the period. Vacuuming removes only archived files; without this the active file could hold a month.
#
# Install to /etc/systemd/journald.conf.d/stayconnect-retention.conf (deploy/scripts/install-service-units.sh).
[Journal]
MaxFileSec=1day
