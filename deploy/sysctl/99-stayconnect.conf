# StayConnect gateway forwarding + hardening
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Don't let the LAN side advertise the WAN as a redirect target.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Martian packets are dropped by the kernel anyway; they are NOT logged: a log line would carry a guest's IP and
# link-layer address into the kernel log, where no retention setting reaches it (GDPR final audit).
net.ipv4.conf.all.log_martians = 0

# TIME_WAIT reuse — busy portal does a lot of short-lived TCP.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Connection tracking for many guests.
net.netfilter.nf_conntrack_max = 262144

# Neighbour (ARP) table sized for the licensed guest count. Linux defaults (soft limit 512, hard limit 1024) are below the 1,700 to 2,000 guests one
# client network can hold; past the hard limit the kernel refuses to create entries ("neighbour: arp_cache: neighbor table overflow!") and replies to
# guests are lost, which showed as portal connections and downloads that failed at random (capacity acceptance, 2026-10-30). IPv4 is what guests use;
# IPv6 to and from client networks is refused, but its table is sized so a neighbour-discovery burst cannot starve the kernel either.
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192
