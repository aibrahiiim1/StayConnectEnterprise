# StayConnect gateway forwarding + hardening
net.ipv4.ip_forward = 1
# No IPv6 is routed for guests (audit Phase 8 L2, SECURITY_HARDENING item 4): the kernel never forwards it, on top
# of the firewall's drop. This does not touch the host's own IPv6: with forwarding off the WAN/management interface
# is a host again and accepts router advertisements under its default accept_ra=1 (with forwarding on it ignored
# them unless accept_ra=2). Do not set disable_ipv6 or accept_ra=0 on "all" here.
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

# Don't let the LAN side advertise the WAN as a redirect target.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Martian packets are dropped by the kernel anyway; they are NOT logged: a log line would carry a guest's IP and
# link-layer address into the kernel log, where no retention setting reaches it (GDPR final audit).
net.ipv4.conf.all.log_martians = 0

# TIME_WAIT reuse — busy portal does a lot of short-lived TCP.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Connection tracking for many guests.
net.netfilter.nf_conntrack_max = 262144
