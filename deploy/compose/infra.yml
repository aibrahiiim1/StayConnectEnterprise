name: stayconnect-infra

# Log rotation on every container: json-file 50m x 5. Without this a chatty
# container can fill the appliance disk (bit the pilot VM before 2026-04).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: stayconnect-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayconnect
      # Generated per appliance by provision-fresh-appliance.sh (secrets/pg-superuser.env); the fallback exists only
      # for development hosts and for appliances whose cluster was initialised before it (audit N-10).
      POSTGRES_PASSWORD: ${STAYCONNECT_PG_PASSWORD:-stayconnect}
      POSTGRES_DB: stayconnect
    # The database's own log keeps no guest data (GDPR audit 2026-10-19, C5): an error is logged without the
    # statement that caused it and without its DETAIL line, which can carry the values of a duplicate key.
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayconnect -d stayconnect"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Smaller than the other containers: the docker log is outside the appliance's log retention, so it is
    # bounded by size alone (GDPR audit C5).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Nothing on the appliance uses Redis (audit AD-63, D10-L2). It is kept only for a development Central that
  # runs on the same host: start it with `docker compose --profile central-dev -f infra.yml up -d`.
  redis:
    profiles: ["central-dev"]
    image: redis:7-alpine
    container_name: stayconnect-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
