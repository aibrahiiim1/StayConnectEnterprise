# Paths the operator surfaces write, created before anything tries to use them.
#
# Install to /etc/tmpfiles.d/stayconnect-operator-surfaces.conf.
#
# WHY THESE ARE HERE RATHER THAN CREATED ON DEMAND
# ------------------------------------------------
# Two of them cannot be created on demand at all. scd runs under ProtectSystem=full with an explicit
# ReadWritePaths allowlist, and systemd resolves that allowlist at unit start: a path that does not exist when
# the service starts is not writable afterwards, however the service tries. So the retention config file and
# the timer's override directory must exist FIRST, and systemd-tmpfiles is what guarantees that at boot.
#
# The other two are ownership rather than existence: they are written by one service and read by another, and
# getting that wrong is invisible until an operator clicks something. The appliance already demonstrated both
# failures — edged could not create its own backup directory under a root-owned tree, and a dump written as
# root was unreadable by the process serving the download.

# --- backup retention policy -------------------------------------------------------------------------
# Written by scd when an operator changes retention; sourced by stayconnect-backup-cleanup on every run.
# Created empty: absent and empty both mean "the built-in defaults are in force", which is what the sweep
# itself does, so an appliance that has never been configured behaves identically either way.
f /etc/stayconnect/backup-retention.conf 0644 root root -

# --- nightly sweep schedule --------------------------------------------------------------------------
# A drop-in directory for ONE unit. Deliberately not /etc/systemd/system, which would let scd define or alter
# any unit on the appliance.
d /etc/systemd/system/stayconnect-backup-cleanup.timer.d 0755 root root -

# --- database backups --------------------------------------------------------------------------------
# Written by scd as root (the dump needs the container) and read by edged as the service user, which lists
# the artefacts and streams the downloads. Group-owned by the service so 0640 dumps are readable by it
# without being readable by everyone — a backup is a complete copy of the site's data.
d /opt/stayconnect/backups/db 0750 root stayconnect -

# --- guest portal images -----------------------------------------------------------------------------
# Written by edged on upload, served by portald to guest devices before sign-in. Both run as the service
# user, so it owns the directory outright.
d /opt/stayconnect/portal-assets 0755 stayconnect stayconnect -
