# The shared log directory, and the mode it needs now that more than one account writes there.
#
# Install to /etc/tmpfiles.d/stayconnect-logs.conf.
#
# WHY 0775 AND NOT 0755. /var/log/stayconnect is owned stayconnect:stayconnect and was 0755, which was
# correct while every Go service ran as that one account. portald now runs as stayconnect-portald (its own
# uid, because it listens on every guest VLAN and used to share edged's identity), with stayconnect as a
# supplementary group. Its unit lists /var/log/stayconnect in ReadWritePaths=, and those two facts together
# are a trap: systemd grants the sandbox mount, the kernel then denies the write, and the failure appears as
# a service-level error with nothing in the logs -- because the thing that failed was writing the log.
#
# Group-writable rather than world-writable: the group is the set of accounts that share this appliance's
# service identity, which is exactly who should be able to write here.
#
# DECLARED HERE rather than left to a chmod in the provisioning script, because a one-time chmod is only
# ever true on the machine it ran on. This is re-asserted at every boot and by every install, on both paths.
d /var/log/stayconnect 0775 stayconnect stayconnect -
