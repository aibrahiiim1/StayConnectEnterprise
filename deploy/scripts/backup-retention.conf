# stayconnect backup retention policy (/etc/stayconnect/backup-retention.conf)
# Tuned per artifact type by rollback value vs storage risk. Edit + the next
# cleanup run (post-deploy or the daily timer) picks it up.

# Binary rollback backups kept PER binary name (ctrlapi / scd / edged / acctd ...).
# 5 gives several known-good rollback targets without unbounded growth.
KEEP_BINARIES=5

# UI release dirs kept per app, ON TOP OF the always-protected current + previous
# (so a rollback to previous is always possible).
KEEP_RELEASES=5

# OneGate CENTRAL only: database dumps kept (the newest is never deleted). An appliance ignores this: its backups are the one backup
# system's, below.
KEEP_DB=7

# ---- Appliance backups: one system, one policy (Hotel Admin -> Backups writes these) --------------------------------------------
# Scheduled backups are OFF until an administrator switches them on. What a restore, a migration or a deployment take first is
# taken whatever this says.
BACKUP_ENABLED=0
# Hour of the day (appliance clock, 0-23) at or after which a scheduled backup is taken, and how many days apart they are.
BACKUP_HOUR=2
BACKUP_EVERY_DAYS=1
# Scheduled and manual backups kept (1-30), and the protective backups kept (2-20): those taken before a restore, a migration or a
# deployment. Counts only; the newest is always kept.
BACKUP_KEEP=7
SAFETY_BACKUP_KEEP=3

# Config *.bak* files (netplan, /etc/stayconnect).
KEEP_CONFIG=3

# Disk-usage thresholds (% of / used) that raise warning / critical alerts.
DISK_WARN=80
DISK_CRIT=90

# Days the database a restore set aside is kept before it is removed (it still holds data erased since the backup).
SET_ASIDE_DAYS=14
