# Drop-in for kea-dhcp4-server.service (install to
# /etc/systemd/system/kea-dhcp4-server.service.d/override.conf).
#
# The stock Kea unit ships with NO Restart= policy, so a Kea crash left guest
# DHCP dead until a manual restart. Make it recover automatically and never
# permanently fail. netd re-reconciles Kea's config on its own, so a bare
# restart is safe.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
# Adaptive crash-loop backoff before each (re)start — backoff-only mode, so the
# distro ExecStart is untouched (see data-plane/cmd/svc-run).
ExecStartPre=/opt/stayconnect/bin/svc-run kea

# ---------------------------------------------------------------------------
# LET KEA PERSIST ITS OWN CONFIG.
#
# netd applies guest-network DHCP over the control socket with config-set, then
# calls config-write so a COLD start uses the same config. config-write was
# failing:
#
#     Error during write-config: Unable to open file /etc/kea/kea-dhcp4.conf for writing
#
# Kea runs as _kea, and both /etc/kea and the config file are root-owned, so the
# daemon cannot write the file it was started with. Two consequences, and the
# second is the one an operator actually hits:
#
#   1. config-write returns an error, netd's ConfigSet propagates it, and the
#      whole network apply is recorded as FAILED -- even though the live
#      config-set had already succeeded. That is the "failed" row in Config
#      history next to a change that visibly took effect.
#
#   2. the on-disk config keeps the pre-guest-network default (br-lan,
#      10.10.0.0/24, no VLAN subnet at all), so the moment Kea restarts or the
#      appliance reboots, DHCP serves the wrong network and a device on the
#      configured guest VLAN gets NO ADDRESS. Nothing looks broken: Kea is
#      running, the bridge is up, the VLAN interface is up.
#
# The `+` prefix runs this as root rather than as User=_kea, which is the whole
# point -- the unit's own user is exactly the one that cannot fix this.
# Idempotent, guarded on the account existing, and it grants the daemon write
# access to its own config file and to the directory config-write needs, and to
# nothing else.
ExecStartPre=+/bin/sh -c 'id -u _kea >/dev/null 2>&1 && { chown _kea:_kea /etc/kea/kea-dhcp4.conf 2>/dev/null; chmod 0640 /etc/kea/kea-dhcp4.conf 2>/dev/null; chgrp _kea /etc/kea 2>/dev/null; chmod 0750 /etc/kea 2>/dev/null; }; exit 0'
